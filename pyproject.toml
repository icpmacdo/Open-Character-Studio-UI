[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-character-tinker"
version = "0.0.1"
description = "A Tinker reference implementation of Open Character Training (arXiv 2511.01689), and a dense-vs-MoE scaling study of the recipe."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ian MacDonald" }]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Tinker training backend. Installed separately for runs; kept optional so the
# package imports and tests pass without the training stack present.
train = [
    "tinker>=0.23.0",
    # [inkling] pulls tml-renderers + torch>=2.10 for the tml_v0 renderer
    # (thinkingmachines/Inkling); keep in lockstep with the vendored copy.
    "tinker-cookbook[inkling]>=0.5.2",
    "datasets>=2.18",
]
# Off-Tinker serving of the local merged adapter for `octt run --eval-merged-local`
# (Tinker has no adapter re-upload). Feasible only for the small dense rungs.
local-eval = [
    "transformers>=4.44",
    "peft>=0.11",
    "torch>=2.2",
]
# Standard capability benchmarks via LightEval. Keep this as plain LightEval:
# `lighteval[adapters]` pins an old PEFT that conflicts with our local-eval extra.
capabilities = [
    "lighteval>=0.13",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "numpy>=1.26",  # exercises the merge math (the real path uses torch via safetensors)
]

[project.scripts]
octt = "octt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["octt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
